<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Image</title>
        <link href="css/image.css" rel="stylesheet">
    </head>
    <body>
        <div class="carousel-container">
            <button class="prev-button"> < </button>
            <div class="carousel-track">
                <img src="images/mountain.jpg" class="slide">
                <img src="images/bird.jpg" class="slide">
                <img src="images/people.jpg" class="slide">
                <img src="images/mountain.jpg" class="slide">
                <img src="images/bird.jpg" class="slide">
            </div>
            <button class="next-button"> > </button>
            <div class="nav-dots">
                <button data-index="0" class="dot active"></button>
                <button data-index="1" class="dot"></button>
                <button data-index="2" class="dot"></button>
            </div>
        </div>
        <script src="image.js"></script>
    </body>
</html>
